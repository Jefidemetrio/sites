<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Multi-empresa portuguesa: Web Development, Company Administration, Advertising, Modular Construction">
  <title>Dinâmicos.pt - Holding Multi-Empresa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ========== DESIGN TOKENS ========== */
    :root {
      /* Paleta Corporativa - 5 empresas */
      --primary-corp-1: #1E40AF;
      --primary-corp-2: #0F766E;
      --primary-corp-3: #924483;
      --primary-corp-4: #C2410C;
      --primary-corp-5: #7E22CE;
      
      /* Cores de Acento */
      --accent-1: #F59E0B;
      --accent-2: #10B981;
      --accent-3: #34D399;
      --accent-4: #60A5FA;
      --accent-5: #A855F7;
      
      /* Neutros */
      --white: #FFFFFF;
      --off-white: #F8FAFC;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1E293B;
      --gray-900: #0F172A;
      --black: #000000;
      
      /* Cores dinâmicas por empresa */
      --primary: var(--primary-corp-1);
      --accent: var(--accent-1);
      --background: var(--white);
      --surface: var(--off-white);
      --border: var(--gray-200);
      
      /* Tipografia */
      --font-family-base: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-family-mono: 'JetBrains Mono', 'Fira Code', monospace;
      --font-weight-light: 300;
      --font-weight-regular: 400;
      --font-weight-medium: 500;
      --font-weight-semibold: 600;
      --font-weight-bold: 700;
      --font-weight-extrabold: 800;
      
      /* Tamanhos */
      --font-size-xs: 0.75rem;
      --font-size-sm: 0.875rem;
      --font-size-base: 1rem;
      --font-size-lg: 1.125rem;
      --font-size-xl: 1.25rem;
      --font-size-2xl: 1.5rem;
      --font-size-3xl: 1.875rem;
      --font-size-4xl: 2.25rem;
      
      /* Espaçamento (8pt system) */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 2.5rem;
      --space-8: 3rem;
      
      /* Radius e sombras */
      --radius-sm: 0.125rem;
      --radius-md: 0.375rem;
      --radius-lg: 0.5rem;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      
      /* Transições */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
    }
    
    /* ========== RESET ========== */
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-family-base);
      font-weight: var(--font-weight-regular);
      font-size: var(--font-size-base);
      line-height: 1.5;
      color: var(--gray-900);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
    }
    img, picture, video, canvas { display: block; max-width: 100%; }
    input, button, textarea, select { font-family: inherit; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; border: none; }
    
    /* ========== UTILITIES ========== */
    .container { max-width: 1280px; margin: 0 auto; padding: 0 var(--space-5); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    
    .grid { display: grid; }
    .grid-cols-1 { grid-template-columns: 1fr; }
    .grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
    .gap-4 { gap: var(--space-4); }
    .gap-5 { gap: var(--space-5); }
    .gap-6 { gap: var(--space-6); }
    
    .text-center { text-align: center; }
    .text-left { text-align: left; }
    .text-right { text-align: right; }
    
    .font-light { font-weight: var(--font-weight-light); }
    .font-regular { font-weight: var(--font-weight-regular); }
    .font-medium { font-weight: var(--font-weight-medium); }
    .font-semibold { font-weight: var(--font-weight-semibold); }
    .font-bold { font-weight: var(--font-weight-bold); }
    .font-extrabold { font-weight: var(--font-weight-extrabold); }
    
    .leading-tight { line-height: 1.25; }
    .leading-normal { line-height: 1.5; }
    .leading-relaxed { line-height: 1.625; }
    
    .mt-4 { margin-top: var(--space-4); }
    .mt-6 { margin-top: var(--space-6); }
    .mb-4 { margin-bottom: var(--space-4); }
    .mb-6 { margin-bottom: var(--space-6); }
    .px-4 { padding-left: var(--space-4); padding-right: var(--space-4); }
    .py-4 { padding-top: var(--space-4); padding-bottom: var(--space-4); }
    
    /* ========== BREAKPOINTS ========== */
    @media (min-width: 640px) {
      .sm\:px-6 { padding-left: var(--space-6); padding-right: var(--space-6); }
      .sm\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
      .sm\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
    }
    @media (min-width: 768px) {
      .md\:px-6 { padding-left: var(--space-6); padding-right: var(--space-6); }
      .md\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
      .md\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
      .md\:grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1024px) {
      .lg\:px-8 { padding-left: var(--space-8); padding-right: var(--space-8); }
    }
    
    /* ========== TYPOGRAPHY ========== */
    h1, h2, h3, h4, h5, h6 {
      line-height: 1.2;
      margin-top: 0;
      margin-bottom: var(--space-3);
    }
    h1 { font-size: var(--font-size-4xl); font-weight: var(--font-weight-extrabold); }
    h2 { font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); }
    h3 { font-size: var(--font-size-2xl); font-weight: var(--font-weight-semibold); }
    p { margin-bottom: var(--space-4); }
    
    .eyebrow {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-bold);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gray-500);
    }
    
    /* ========== COMPONENTS ========== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-6);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semibold);
      border-radius: var(--radius-md);
      transition: all var(--transition-fast);
      text-decoration: none;
      background: var(--primary);
      color: var(--white);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .btn:focus { outline: 2px solid var(--primary); outline-offset: 2px; }
    
    .btn-accent {
      background: var(--accent);
      color: var(--gray-900);
    }
    .btn-accent:hover {
      background: color-mix(in srgb var(--accent) 90%, black);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }
    
    .btn-secondary {
      background: var(--white);
      color: var(--gray-700);
      border: 1px solid var(--gray-300);
    }
    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--primary);
      color: var(--primary);
    }
    
    .card {
      background: var(--white);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-normal);
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }
    
    .card-header { padding: var(--space-5); border-bottom: 1px solid var(--border); }
    .card-body { padding: var(--space-5); }
    .card-footer { padding: var(--space-4) var(--space-5); border-top: 1px solid var(--border); }
    
    /* ========== NAVIGATION ========== */
    .nav { display: flex; align-items: center; justify-content: space-between; }
    .nav__logo { font-size: var(--font-size-2xl); font-weight: var(--font-weight-extrabold); color: var(--primary); }
    .nav__links { display: flex; gap: var(--space-6); }
    .nav__link { color: var(--gray-700); font-weight: var(--font-weight-medium); transition: color 0.2s; }
    .nav__link:hover { color: var(--primary); }
    .nav__cta { background: var(--accent); color: var(--gray-900); }
    
    /* ========== HERO ========== */
    .hero {
      padding: var(--space-8) var(--space-5);
      text-align: center;
      background: var(--surface);
    }
    .hero__title { font-size: var(--font-size-4xl); font-weight: var(--font-weight-extrabold); margin-bottom: var(--space-4); }
    .hero__subtitle { font-size: var(--font-size-lg); color: var(--gray-600); max-width: 40rem; margin: 0 auto var(--space-6); }
    
    @media (min-width: 768px) {
      .hero__title { font-size: var(--font-size-5xl); }
    }
    
    /* ========== SECTION TITLE ========== */
    .section-title { text-align: center; margin-bottom: var(--space-8); }
    .section-title h2 { font-size: var(--font-size-3xl); }
    .section-title p { color: var(--gray-600); max-width: 30rem; margin: 0 auto; }
    
    /* ========== 4-STEP PROCESS ========== */
    .process { padding: var(--space-8) 0; }
    .process__steps { display: flex; flex-direction: column; gap: var(--space-6); }
    @media (min-width: 640px) {
      .process__steps { flex-direction: row; justify-content: center; }
    }
    @media (min-width: 768px) {
      .process__steps { gap: var(--space-8); }
    }
    
    .process__step {
      flex: 1;
      text-align: center;
      padding: var(--space-4);
    }
    .process__icon { font-size: 2.5rem; margin-bottom: var(--space-3); }
    .process__number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 3rem;
      height: 3rem;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: var(--white);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-3);
    }
    
    /* ========== FOOTER ========== */
    .footer {
      background: var(--gray-900);
      color: var(--white);
      padding: var(--space-8) 0 var(--space-4);
    }
    .footer__nav { display: flex; flex-wrap: wrap; gap: var(--space-6); justify-content: center; margin-bottom: var(--space-6); }
    .footer__link { color: var(--gray-400); font-weight: var(--font-weight-medium); }
    .footer__link:hover { color: var(--white); }
    .footer__bottom { text-align: center; padding-top: var(--space-4); border-top: 1px solid var(--gray-800); color: var(--gray-500); font-size: var(--font-size-sm); }
    
    /* ========== COMPANY COLORS ========== */
    .company-1 { --primary: var(--primary-corp-1); --accent: var(--accent-1); }
    .company-2 { --primary: var(--primary-corp-2); --accent: var(--accent-2); }
    .company-3 { --primary: var(--primary-corp-3); --accent: var(--accent-5); }
    .company-4 { --primary: var(--primary-corp-4); --accent: var(--accent-1); }
    .company-5 { --primary: var(--primary-corp-5); --accent: var(--accent-5); }
    
    /* ========== DARK MODE ========== */
    @media (prefers-color-scheme: dark) {
      .dark {
        --background: var(--gray-900);
        --surface: var(--gray-800);
        --text: var(--white);
      }
    }
  </style>
</head>
