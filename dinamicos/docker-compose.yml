version: '3.8'

services:
  # Database PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: dinamicos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-directus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      POSTGRES_DB: ${POSTGRES_DB:-dinamicos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dinamicos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Directus CMS
  directus:
    image: directus/directus:10
    container_name: dinamicos-directus
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEY: ${DIRECTUS_KEY:-some-random-key}
      SECRET: ${DIRECTUS_SECRET:-some-very-long-secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dinamicos.pt}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-password}
      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-dinamicos}
      DB_USER: ${POSTGRES_USER:-directus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-directus}
      PORT: 8055
    volumes:
      - ./directus/uploads:/usr/src/directus/uploads
    restart: unless-stopped
    networks:
      - dinamicos-network
    ports:
      - "8055:8055"
    healthcheck:
      test: ["CMD", "wget", "--skip-ssl", "-q", "-O", "/dev/null", "http://localhost:8055/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Next.js Frontend
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dinamicos-web
    depends_on:
      directus:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://dinamicos.pt}
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-http://directus:8055}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - dinamicos-network
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--skip-ssl", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:

networks:
  dinamicos-network:
    driver: bridge