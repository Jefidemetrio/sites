version: '3.8'

services:
  # Frontend Next.js - Directus e PostgreSQL são externos (já instalados)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dinamicos-web
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://dinamicos.jefi.com.br}
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-https://directus.jefi.com.br}
      DIRECTUS_TOKEN: ${DIRECTUS_TOKEN:-}
      NODE_ENV: production
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--skip-ssl", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 5

networks: {}