<!DOCTYPE html>
<html lang="pt-BR" prefix="og: https://schema.org/">
<head>
  <!-- SEO Meta Tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinâmicos | Presença digital inteligente para empresas portuguesas</title>
  <meta name="description" content="Site institucional minimalista para PMEs tecnológicas em Portugal. Foco em SEO Google + descoberta por agentes IA. Transforme sua presença digital hoje.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Dinâmicos - Presença digital inteligente">
  <meta property="og:description" content="Site institucional minimalista para PMEs tecnológicas em Portugal.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dinamicos.jefi.com.br">
  <meta property="og:image" content="https://dinamicos.jefi.com.br/og-image.png">
  
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Dinâmicos - Presença digital inteligente">
  <meta name="twitter:description" content="Site institucional minimalista para PMEs tecnológicas em Portugal.">
  
  <!-- AI Engine Optimization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Dinâmicos",
    "url": "https://dinamicos.jefi.com.br",
    "logo": "https://dinamicos.jefi.com.br/logo.png",
    "description": "Presença digital inteligente para empresas portuguesas",
    "founder": {
      "@type": "Person",
      "name": "Jef"
    },
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+351-XXX-XXX-XXX",
      "contactType": "Customer Service",
      "availableLanguage": ["Portuguese", "English"]
    },
    "sameAs": [
      "https://linkedin.com/company/dinamicos",
      "https://twitter.com/dinamicos"
    ]
  }
  </script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Preload critical assets -->
  <link rel="preload" href="style.css" as="style">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <a href="/" class="logo">Dinâmicos</a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/servicos">Serviços</a>
        <a href="/sobre">Sobre</a>
        <a href="/blog">Blog</a>
        <a href="/contato">Contato</a>
      </nav>
      <button class="mobile-menu-btn" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="main-content">
    <section class="hero">
      <div class="container">
        <h1 class="hero-title">Presença digital <span class="highlight">inteligente</span> para empresas portuguesas</h1>
        <p class="hero-subtitle">Site institucional minimalista, otimizado para Google e agentes de IA.</p>
        <div class="hero-actions">
          <a href="/contato" class="btn btn-primary">Começar agora</a>
          <a href="/sobre" class="btn btn-secondary">Saber mais</a>
        </div>
      </div>
    </section>

    <!-- Resto do conteúdo será adicionado -->
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Dinâmicos. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
