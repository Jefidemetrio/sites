# Dokploy Deployment Configuration
# Configure Git Provider Integration

---
# Service Configuration
name: Dinâmicos Website
description: Site institucional B2B minimalista
tags:
  - website
  - b2b
  - portuguese

---
# Docker Configuration
dockerfile_path: ./Dockerfile
build_context: .
image_name: dinamicos
docker_compose_path: ./docker-compose.yml

---
# Environment Variables
environment:
  NODE_ENV: production
  DIRECTUS_URL: http://localhost:8055
  SITE_URL: https://dinamicos.jefi.com.br

---
# Port Configuration
ports:
  web:
    host: 0.0.0.0
    port: 3000
    public: 3000

---
# Git Provider Settings
git:
  provider: github  # github, gitlab, bitbucket
  repository: Jefidemetrio/sites
  branch: main
  # Dokploy will auto-deploy on push
  # Configure webhook in GitHub repo settings

---
# Health Check
healthcheck:
  enabled: true
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s
  endpoint: /

---
# SSL/TLS Configuration
ssl:
  enabled: true
  # Dokploy auto-provisions Let's Encrypt certificates
  domains:
    - dinamicos.jefi.com.br
  force_https: true

---
# Backup Configuration
backup:
  enabled: false
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: 7 days

---
# Resources
resources:
  limits:
    cpu: "0.5"
    memory: 512M
  reservations:
    cpu: "0.25"
    memory: 256M

---
# Notifications (Optional)
notifications:
  webhook_urls: []
  # Add Slack/Discord/Telegram webhooks here